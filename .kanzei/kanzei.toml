effect = "allow"

# conventions patch 永久放行(用户 2026-08-12 决定):引擎默认只放行 conventions get,
# patch 落在 Ask 上;而自主推进/鞭挞轮是 NonInteractive 档位,Ask 被直接跳过——
# 自动轮因此永远做不了 R-191 这类规范下沉。放行后自动轮可改 conventions.md,
# 代价是 agent 能改自己的规则书(D-235 原本要防的就是这个,此处是显式让渡)。
[[permissions.rules]]
action = "conventions"
resource = "patch"
effect = "allow"

# D-295:test_record 白名单(用户 2026-08-12 交互轮批准)——D-264 source_test_gate 要求
# 「暂存源码改动之后收尾的 passed 测试记录」,autonomous 档位若不放行 test_record,
# 任何 Rust 源码提交都会被门禁与权限双杀死锁,已验证代码只能滞留工作树。
[[permissions.rules]]
action = "test_record"
resource = "*"
effect = "allow"


[[permissions.rules]]
action = "bash"
resource = '{"command":"Get-ChildItem -Recurse -Depth 2 -Include *.ps1,*.toml,*.json,*.conf* -Path scripts,src-tauri,crates/kanzei-app 2>$null | Select-Object -First 5 FullName; Get-ChildItem scripts | Select-Object Name","workdir":"c:/users/kanzei/documents/kanzei code"}'
effect = "allow"
