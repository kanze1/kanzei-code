# 项目覆盖配置；保留模型选择与现有权限。全局 provider 在 ~/.kanzei/kanzei.toml。

[models]
primary = "ollama:qwen38-agent-256k:latest"
fast = "ollama:qwen38-agent-256k:latest"
compact = "ollama:qwen38-agent-256k:latest"
reasoning = "xhigh"
codex_fast_mode = true

[profile]

[[permissions.rules]]
action = "req"
resource = "*"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "Get-ChildItem *"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "Get-Content *"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "./scripts/release.ps1"
effect = "allow"

[[permissions.rules]]
action = "defect"
resource = "*"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "Get-Process *"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "Get-Item *"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "git *"
effect = "allow"

[[permissions.rules]]
action = "edit"
resource = "crates/kanzei-app/ui/style.css"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git status --short; git log --oneline -5\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"select-string -path crates/kanzei-app/src/main.rs,crates/kanzei-app/ui/main.js,crates/kanzei-app/ui/index.html -pattern 'kanzei_build_info','v0.1.0','version','日志' | select-object -first 120 path,linenumber,line\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git status --short --branch; git rev-parse --short head; get-item /\"$env:userprofile/.cargo/bin/kzapp.exe/\" | select-object fullname,length,lastwritetime\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git status --short --branch\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git add .kanzei/project; git commit -m /\"整理发版前需求与缺陷追踪/\"\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git log --format=/\"%h %an <%ae> | %s/\" -1; git log --format=/\"%h %an <%ae> | %s/\" origin/dev..dev\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"get-childitem -path /\"docs/\" -recurse -file | select-object fullname, length, lastwritetime | format-table -autosize\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"write-host /\"=== temp update log ===/\"; if (test-path /\"$env:temp/kanzei-update.log/\") { get-content /\"$env:temp/kanzei-update.log/\" } else { write-host /\"(不存在)/\" }; write-host /\"=== temp helper/installer ===/\"; get-childitem /\"$env:temp/\" -filter /\"kanzei-*/\" -erroraction silentlycontinue | select-object name, length, lastwritetime; write-host /\"=== localappdata kanzei ===/\"; get-childitem /\"$env:localappdata/kanzei/\" -erroraction silentlycontinue | select-object name, length, lastwritetime; write-host /\"=== running kzapp ===/\"; get-process kzapp -erroraction silentlycontinue | select-object id, starttime, path\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"./scripts/release.ps1 -skiptests 2>&1 | foreach-object { $_ }\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"write-host /\"=== 安装位版本 ===/\"; (get-item /\"$env:localappdata/kanzei/kzapp.exe/\").versioninfo | select-object productversion, fileversion | format-list; write-host /\"=== 文件时间 ===/\"; get-item /\"$env:localappdata/kanzei/kzapp.exe/\" | select-object lastwritetime, length | format-list; write-host /\"=== 进程 ===/\"; get-process -name /\"kzapp/\",/\"msedgewebview2/\" -erroraction silentlycontinue | select-object id, processname, starttime | format-table; write-host /\"=== kz cli ===/\"; kz --version 2>&1; write-host /\"=== pending ===/\"; test-path /\"$env:localappdata/kanzei/kzapp.exe.pending/\"\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git grep -n /\"cleanup_orphan_webviews/\" -- crates/kanzei-app/src/main.rs\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"(get-content 'crates/kanzei-app/src/main.rs').count\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"git worktree list\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"Get-Content '.kanzei/project/tests-archive.md' -TotalCount 40; Write-Host '=== 重复编号统计 ==='; (Select-String -Path '.kanzei/project/tests-archive.md' -Pattern 'T-[0-9]*' -AllMatches).Matches.Value | Group-Object | Where-Object { $_.Count -gt 1 } | Select-Object Name, Count\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"grep -o \\\"T-[0-9]*\\\" .kanzei/project/tests-archive.md | sort | uniq -c | sort -rn | Select-Object -First 10\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "conventions"
resource = "patch"
effect = "allow"

[[permissions.rules]]
action = "test_record"
resource = "*"
effect = "allow"

[[permissions.rules]]
action = "bash"
resource = "{\"command\":\"Get-ChildItem -Recurse -Depth 2 -Include *.ps1,*.toml,*.json,*.conf* -Path scripts,src-tauri,crates/kanzei-app 2>$null | Select-Object -First 5 FullName; Get-ChildItem scripts | Select-Object Name\",\"workdir\":\"c:/users/kanzei/documents/kanzei code\"}"
effect = "allow"

[[permissions.rules]]
action = "process"
resource = "process output"
effect = "allow"

[[permissions.rules]]
action = "work"
resource = "write:claim"
effect = "allow"

[[permissions.rules]]
action = "insert"
resource = "crates/kanzei-app/src/phase_pipeline_tests.rs"
effect = "allow"

[[permissions.rules]]
action = "insert"
resource = "crates/kanzei-app/ui/index.html"
effect = "allow"

[[permissions.rules]]
action = "idea"
resource = "read:list"
effect = "allow"

[[permissions.rules]]
action = "work"
resource = "read:get_unit"
effect = "allow"

[[permissions.rules]]
action = "insert"
resource = "crates/kanzei-app/ui/style.css"
effect = "allow"

[[permissions.rules]]
action = "work"
resource = "read:list_units"
effect = "allow"

[[permissions.rules]]
action = "decision"
resource = "write:add"
effect = "allow"
