<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kanzei · 视觉原型 03 · 橙青点缀</title>
  <link rel="icon" href="/assets/kanzei.svg">
  <link rel="stylesheet" href="review.css">
  <script type="module" src="review.js"></script>
</head>
<body>
  <header class="review-header">
    <div class="review-identity"><span class="review-mark"></span><strong>视觉原型 <span>03</span></strong></div>
    <nav class="review-scenes" aria-label="预览页面">
      <button data-scene="chat" aria-pressed="true">对话</button>
      <button data-scene="empty" aria-pressed="false">新对话</button>
      <button data-scene="work" aria-pressed="false">管理</button>
      <button data-scene="memory" aria-pressed="false">记忆</button>
      <button data-scene="skills" aria-pressed="false">Skills</button>
      <button data-scene="settings" aria-pressed="false">设置</button>
    </nav>
    <div class="review-tools">
      <button id="baseline" aria-pressed="false">发行版对照</button>
      <button id="narrow" aria-pressed="false">420px</button>
      <span class="tool-divider"></span>
      <button id="theme" aria-pressed="false" title="切换到深色">深色</button>
      <button id="colors" popovertarget="color-notes">配色说明 <span class="swatch-dots" aria-hidden="true"><i></i><i></i></span></button>
    </div>
  </header>
  <main id="stage">
    <div id="frame-wrap"><iframe id="product" title="Kanzei 视觉与配色原型"></iframe><div id="loading" role="status">正在准备预览…</div></div>
  </main>
  <footer class="review-footer"><span id="caption">更轻的轮廓，更清楚的主次。</span><span>基于 build-8fb9f71d · 隔离示例数据</span></footer>
  <aside id="color-notes" popover>
    <header><h2>用橙与青点亮细节</h2><button popovertarget="color-notes" popovertargetaction="hide" aria-label="关闭配色说明">×</button></header>
    <p>保留现有底色，让当前动作和内容焦点多一点颜色。</p>
    <div class="surface-samples" aria-label="当前主题的发行版底色"><span class="sample-main">页面</span><span class="sample-sidebar">侧栏</span><span class="sample-composer">输入区</span></div>
    <small>底色、正文色、明暗层次和侧栏纹理保持现状。</small>
    <dl>
      <div><dt><i class="orange"></i>橙色 · 当前与动作</dt><dd>发送、当前对话的细线、工作选择、运行数。</dd></div>
      <div><dt><i class="cyan"></i>青色 · 内容与可用状态</dt><dd>管理页签与编号、完成进度、已启用开关。</dd></div>
    </dl>
    <div class="color-examples"><span class="demo-running"><i></i>正在进行</span><span class="demo-done">✓ 已完成</span><span class="demo-id">R-364</span></div>
    <p class="color-footnote">颜色集中在短线、小图标、编号和开关，正文与大面积底色保持现状。深浅色均沿用发行版适配值。</p>
  </aside>
</body>
</html>
