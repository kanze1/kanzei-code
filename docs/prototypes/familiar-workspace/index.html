<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kanzei · 交互原型</title>
  <link rel="icon" href="brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9ZM14 3v6h6M8 14h8M8 17h5"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M18 7c0 8-12 3-12 8"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A9 9 0 0 1 8.5 4a9 9 0 1 0 11.5 11.5Z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 3l-4 18"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3" fill="var(--sidebar)"/><circle cx="16" cy="17" r="3" fill="var(--sidebar)"/></symbol>
  </defs></svg>
  <div id="shell">
    <aside id="sidebar" aria-label="项目与对话"></aside>
    <button id="sidebar-scrim" aria-label="关闭侧栏" data-action="toggle-sidebar"></button>
    <main id="main">
      <header id="topbar"></header>
      <div id="body-layout">
        <div id="center">
          <section id="page" aria-label="工作区内容"></section>
          <div id="compose-zone">
            <button id="compose-expand" data-action="expand-compose"></button>
            <div id="run-status" aria-live="polite"></div>
            <div id="queue-list"></div>
            <section id="composer" aria-label="对话输入">
              <div id="recipient-line"></div>
              <div id="attachment-list"></div>
              <textarea id="prompt" rows="2" placeholder="继续这个任务…" aria-label="输入消息"></textarea>
              <div id="composer-tools">
                <div class="composer-options">
                  <button class="icon-button" id="attach" data-action="attach" aria-label="添加附件" title="添加附件"><svg class="icon"><use href="#i-plus"/></svg></button>
                  <button id="model-control" class="control" data-menu="model" aria-haspopup="menu"></button>
                  <button id="thinking-control" class="control" data-menu="thinking" aria-haspopup="menu"></button>
                  <button id="mode-control" class="control" data-menu="mode" aria-haspopup="menu"></button>
                  <button id="permission-control" class="control" data-menu="permission" aria-haspopup="menu"></button>
                </div>
                <div class="composer-actions">
                  <button id="delivery-control" class="control" data-menu="delivery" aria-haspopup="menu">排队</button>
                  <button class="icon-button" id="more-control" data-menu="more" aria-label="更多运行选项" aria-haspopup="menu" title="更多运行选项"><svg class="icon"><use href="#i-more"/></svg></button>
                  <button class="icon-button" id="voice" data-action="voice" aria-label="语音输入演示" title="语音输入演示"><svg class="icon"><use href="#i-mic"/></svg></button>
                  <button class="icon-button stop-button" id="stop" data-action="stop" aria-label="停止当前运行" title="停止当前运行"><svg class="icon"><use href="#i-stop"/></svg></button>
                  <button class="send-button" id="send" data-action="send" aria-label="发送消息" title="发送消息"><svg class="icon"><use href="#i-arrow"/></svg></button>
                </div>
              </div>
            </section>
            <div class="composer-foot"><span id="compose-hint">Enter 发送 · Shift+Enter 换行</span><span id="config-hint"></span></div>
          </div>
        </div>
        <aside id="inspector" aria-label="详情面板" hidden></aside>
      </div>
    </main>
  </div>
  <div id="popover" class="popover" role="menu" hidden></div>
  <section id="preview-window" role="region" aria-label="独立网页预览窗口" hidden></section>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-input" multiple hidden>
</body>
</html>
