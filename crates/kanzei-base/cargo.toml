[package]
name = "kanzei-base"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "原子写与文件锁"

[package.metadata.kanzei]
# 架构图 crate 依赖图的分组(docs/design/architecture_diagrams.md)
group = "基础"

[dependencies]
sha2.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
