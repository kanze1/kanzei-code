[package]
name = "kanzei-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 桌面端"

[package.metadata.kanzei]
# 架构图 crate 依赖图的分组(docs/design/architecture_diagrams.md)
group = "入口"

[[bin]]
name = "kzapp"
path = "src/main.rs"

[build-dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
heck = "0.5"
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest.workspace = true
futures.workspace = true
tauri = { version = "2", features = [] }
rfd = "0.15"
dirs.workspace = true
toml.workspace = true
toml_edit.workspace = true
kanzei-core.workspace = true
kanzei-base.workspace = true
kanzei-harness.workspace = true
kanzei-llm.workspace = true
kanzei-tools.workspace = true
kanzei-memory.workspace = true
kanzei-runtime.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
chrono = "0.4"
# UI 自查工具(R-126)在本 crate 定义:它们要访问真实运行中的窗口,天然属于应用层。
async-trait.workspace = true
base64.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
calamine = { version = "0.36", features = ["chrono"] }
png.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom = "0.3"
tempfile.workspace = true
httparse = "1"
rusqlite.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
# D-240:安装助手必须按真实进程句柄判断父进程退出，不能从 tasklist 的本地化文本猜测。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
kanzei-base = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
