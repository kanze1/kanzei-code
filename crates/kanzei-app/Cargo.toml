[package]
name = "kanzei-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kzapp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest.workspace = true
futures.workspace = true
tauri = { version = "2", features = [] }
rfd = "0.15"
dirs.workspace = true
toml.workspace = true
toml_edit.workspace = true
kanzei-core.workspace = true
kanzei-harness.workspace = true
kanzei-llm.workspace = true
kanzei-tools.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# UI 自查工具(R-126)在本 crate 定义:它们要访问真实运行中的窗口,天然属于应用层。
async-trait.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# D-240:安装助手必须按真实进程句柄判断父进程退出，不能从 tasklist 的本地化文本猜测。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
