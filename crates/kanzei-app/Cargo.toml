[package]
name = "kanzei-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 桌面端"

[package.metadata.kanzei]
# 架构图 crate 依赖图的分组(docs/design/architecture_diagrams.md)
group = "入口"

[[bin]]
name = "kzapp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest.workspace = true
futures.workspace = true
# UI2-0926 #8 网页预览:"unstable" 打开 Window::add_child(子 webview 面板)。调用集中在
# src/preview/pane.rs 一处;升级 tauri 小版本时重跑 docs/design/preview_pane.md 的 B0 验收清单。
tauri = { version = "2", features = ["unstable"] }
rfd = "0.15"
dirs.workspace = true
toml.workspace = true
toml_edit.workspace = true
kanzei-core.workspace = true
kanzei-harness.workspace = true
kanzei-llm.workspace = true
kanzei-tools.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# UI 自查工具(R-126)在本 crate 定义:它们要访问真实运行中的窗口,天然属于应用层。
async-trait.workspace = true
base64.workspace = true
png.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# D-240:安装助手必须按真实进程句柄判断父进程退出，不能从 tasklist 的本地化文本猜测。
# R-249 批2 追加 Gdi + WindowsAndMessaging:窗口截图走 Win32。复用这里已有的
# windows-sys(而不是另引 windows crate)——同一套 API 的两份绑定共存只会让
# 「该用哪个」在后面每次改动时重新问一遍。其它平台由 screenshot.rs 的 cfg 分支
# 返回「未实现」,不编译失败。
# 唯一例外(UI2-0926 #8):WebView2 的 COM 接口(进程内 CDP、共用环境)只有
# webview2-com + windows 这一条路,见下方;普通 Win32 调用仍一律走 windows-sys。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # R-249 批2:验证用例要自己声明 DPI 感知,否则拿到的是虚拟化坐标。
    "Win32_UI_HiDpi",
] }

# UI2-0926 #8 网页预览:WebView2 COM 的唯一入口(src/preview/cdp.rs)。版本与 wry 已拉入的
# 一致(Cargo.lock:webview2-com 0.38.2 / windows 0.61.3),不新增编译单元;只许 cdp.rs 用。
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com"] }
