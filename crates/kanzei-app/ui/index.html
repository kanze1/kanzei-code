<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>kanzei</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="activitybar">
      <div class="activity-item active" data-view="chat" title="对话">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div class="activity-item" data-view="settings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
    </aside>

    <aside id="sidebar">
      <div class="sidebar-section" id="projects-section">
        <div class="section-title">
          <span>项目</span>
          <span>
            <button id="project-init" class="icon-btn" title="初始化新项目目录">✦</button>
            <button id="project-add" class="icon-btn" title="添加项目目录">＋</button>
          </span>
        </div>
        <div id="project-list" class="project-list"></div>
      </div>
      <div class="sidebar-section" id="live-section">
        <div class="section-title"><span>当前进展</span></div>
        <div id="live-status">
          <div id="live-turn" class="live-row dim">空闲</div>
          <div id="live-focus" class="live-row hidden"></div>
          <div id="live-action" class="live-row hidden"></div>
          <div id="live-note" class="live-row hidden"></div>
        </div>
      </div>
      <div class="sidebar-section" id="queue-section">
        <div class="section-title"><span>排队输入 <em id="queue-count"></em></span></div>
        <div id="queue-list" class="queue-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">
          <span>目标 <em id="goal-count"></em></span>
          <span>
            <button id="goal-add" class="icon-btn" title="新建目标">＋</button>
            <button id="goal-open" class="icon-btn" title="打开 goals.md(活跃目标会注入 agent 上下文,没有明确任务时它会自主推进)">↗</button>
          </span>
        </div>
        <div id="goal-list" class="doc-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">
          <span>历史对话 <em id="conversation-count"></em></span>
          <button id="chat-del" class="icon-btn" title="删除勾选的对话">🗑</button>
        </div>
        <div id="conversation-list" class="doc-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">
          <span>需求 <em id="req-count"></em></span>
          <span>
            <select id="req-status-filter" class="doc-filter" title="按状态筛选">
              <option value="all">全部状态</option>
              <option value="doing">doing</option>
              <option value="todo">todo</option>
              <option value="done">done</option>
              <option value="dropped">dropped</option>
            </select>
            <select id="req-priority-filter" class="doc-filter" title="按优先级筛选">
              <option value="all">全部优先级</option>
              <option value="P0">P0</option><option value="P1">P1</option>
              <option value="P2">P2</option><option value="P3">P3</option>
            </select>
            <select id="req-sort" class="doc-filter" title="需求排序">
              <option value="priority">优先级</option>
              <option value="status">状态</option>
              <option value="id">编号</option>
            </select>
            <button id="req-open" class="icon-btn" title="打开 requirements.md 原文">↗</button>
          </span>
        </div>
        <div id="req-list" class="doc-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">
          <span>缺陷 <em id="defect-count"></em></span>
          <button id="defect-open" class="icon-btn" title="打开 defects.md 原文">↗</button>
        </div>
        <div id="defect-list" class="doc-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">
          <span>开发规范</span>
          <span>
            <button id="conv-init" class="icon-btn" title="创建规范模板">＋</button>
            <button id="conv-open" class="icon-btn" title="打开 conventions.md(agent 会遵守此文件)">↗</button>
          </span>
        </div>
        <div id="conv-list" class="doc-list"></div>
      </div>
    </aside>

    <main id="main">
      <!-- 对话视图 -->
      <div id="view-chat" class="view active">
        <header id="topbar">
          <span id="project-label" class="crumb"></span>
          <button id="activity-toggle" class="ghost" title="显示/隐藏右侧活动面板">活动</button>
          <span class="spacer"></span>
          <button id="continue-btn" class="ghost" title="让 agent 检查活跃目标并推进下一步">继续</button>
          <label id="auto-continue-wrap" title="每轮跑完自动发「继续推进目标」">
            <input type="checkbox" id="auto-continue" /> 连跑
          </label>
          <button id="auto-pause" class="ghost" title="暂停/恢复自动连跑">暂停连跑</button>
          <label id="auto-stop-round-wrap" title="当前轮完成后停止连跑">
            <input type="checkbox" id="auto-stop-round" /> 本轮后停
          </label>
          <input id="auto-max" class="auto-max" type="number" min="1" max="100" step="1" value="10" title="连跑上限(1-100)" />
          <button id="new-chat" class="ghost" title="清空多轮对话历史,开一段新会话">新对话</button>
          <label id="auto-allow-wrap" title="本次不再弹权限窗,全部自动放行(相当于 yolo)">
            <input type="checkbox" id="auto-allow" /> 自动放行
          </label>
          <button id="summarize-btn" class="ghost" title="用 fast 模型总结当前对话并存档到 .kanzei/summaries/">总结</button>
          <button id="copy-context" class="ghost" title="把当前对话(含思考/工具轨迹摘要)复制为 markdown,方便贴给其他 AI">复制上下文</button>
          <button id="chat-search-toggle" class="ghost" title="搜索当前对话">搜索</button>
          <span id="chat-search" class="hidden">
            <input id="chat-search-input" placeholder="搜索对话" />
            <span id="chat-search-count"></span>
            <button id="chat-search-prev" class="ghost" title="上一个匹配">↑</button>
            <button id="chat-search-next" class="ghost" title="下一个匹配">↓</button>
          </span>
          <select id="model-select" title="模型(agent 默认或直选)"></select>
          <select id="profile-select" title="模式">
            <option value="dev-pair">结伴开发</option>
            <option value="dev-auto">自主推进</option>
            <option value="research">research 研究</option>
          </select>
        </header>
        <section id="messages">
          <div id="empty-state">
            <div class="logo-mark">K</div>
            <div class="hint">输入任务开始 · 权限请求会弹窗询问 · Ctrl+Enter 发送 · Ctrl/Cmd+K 聚焦输入 · Ctrl/Cmd+Shift+N 新对话 · Ctrl/Cmd+Shift+C 停止</div>
          </div>
        </section>
        <button id="jump-latest" class="ghost hidden">回到最新</button>
        <footer id="composer">
          <input id="attachment-input" type="file" accept="image/*,.pdf,application/pdf" multiple hidden />
          <div id="attachments" class="attachments hidden"></div>
          <textarea id="prompt" rows="3" placeholder="想做什么?可粘贴/拖拽图片或 PDF"></textarea>
          <div id="composer-bar">
            <span id="hint" class="dim"></span>
            <div class="composer-actions">
              <button id="attach" class="ghost" title="添加图片或 PDF">附件</button>
              <select id="delivery-select" title="输入交付方式">
                <option value="queue">排队 queue</option>
                <option value="steer">插入 steer</option>
              </select>
              <button id="stop" class="danger hidden">停止</button>
              <button id="send" class="primary">发送</button>
            </div>
          </div>
        </footer>
      </div>

      <!-- 设置视图 -->
      <div id="view-settings" class="view">
        <div id="settings-scroll">
          <h1>设置</h1>
          <p class="dim">写入全局 <code id="settings-path"></code>,项目级 .kanzei/kanzei.toml 会覆盖全局。</p>

          <h2>模型角色</h2>
          <div class="form-row">
            <label>primary <span class="dim">主循环</span></label>
            <input id="set-primary" placeholder="anthropic:claude-sonnet-5" spellcheck="false" />
          </div>
          <div class="form-row">
            <label>fast <span class="dim">子代理/杂活(本地模型)</span></label>
            <input id="set-fast" placeholder="ollama:qwen3" spellcheck="false" />
          </div>

          <h2>Provider</h2>
          <table id="providers-table">
            <thead><tr><th>名称</th><th>协议</th><th>Base URL</th><th>API Key(环境变量或直填 + 测试)</th><th>上下文(token)</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          <button id="provider-add" class="ghost">+ 添加 provider</button>

          <h2>网络与默认</h2>
          <div class="form-row">
            <label>代理</label>
            <select id="set-proxy-mode">
              <option value="env">跟随环境变量</option>
              <option value="off">直连</option>
              <option value="custom">指定地址</option>
            </select>
            <input id="set-proxy-url" placeholder="http://127.0.0.1:12000" spellcheck="false" class="hidden" />
          </div>
          <div class="form-row">
            <label>默认模式</label>
            <select id="set-profile">
              <option value="dev">dev 开发</option>
              <option value="research">research 研究</option>
            </select>
          </div>

          <h2>版本与更新</h2>
          <div class="form-row">
            <label>当前版本 <span id="update-current" class="dim"></span></label>
            <button id="update-check" class="ghost">检查更新</button>
            <button id="update-install" class="primary hidden">下载并安装</button>
            <span id="update-result" class="dim"></span>
          </div>

          <div class="settings-actions">
            <button id="settings-open" class="ghost">打开配置原文</button>
            <button id="settings-save" class="primary">保存</button>
          </div>
        </div>
      </div>

      <div id="log-panel" class="hidden">
        <div class="log-head">
          <span>运行日志</span>
          <button id="log-clear" class="icon-btn" title="清空">⌫</button>
        </div>
        <div id="log-lines"></div>
      </div>

      <footer id="statusbar">
        <div class="status-left">
          <span id="status-dot" class="dot idle"></span>
          <span id="status-mode">空闲</span>
          <span id="status-text">空闲</span>
          <span id="status-elapsed"></span>
          <span id="status-git" title="git 分支 · 未提交改动"></span>
        </div>
        <div class="status-right">
          <span id="ctx-bar" class="hidden" title="上下文占用"><i id="ctx-bar-fill"></i></span>
          <span id="status-tokens"></span>
          <span id="status-model"></span>
          <button id="log-toggle" class="statusbar-btn" title="显示/隐藏运行日志">日志</button>
          <span id="status-version"></span>
        </div>
      </footer>
    </main>

    <aside id="todo-panel" class="hidden">
      <div class="bg-head">当前计划 <span id="todo-count"></span></div>
      <div id="todo-list"></div>
    </aside>

    <aside id="bg-panel" class="hidden">
      <div class="bg-head">活动 <span id="diff-summary-toggle" class="diff-summary-label"></span></div>
      <div id="diff-summary" class="diff-summary hidden"></div>
      <div id="bg-list"></div>
    </aside>
  </div>

  <div id="ask-overlay" class="hidden">
    <div id="ask-dialog">
      <div class="ask-title" id="ask-title">权限请求</div>
      <div id="ask-queue-status" class="ask-queue-status"></div>
      <div id="ask-queue-preview" class="ask-queue-preview hidden"></div>
      <div class="ask-body">
        <div id="permission-fields">
          <div class="ask-line"><span class="dim">操作</span><code id="ask-action"></code></div>
          <div class="ask-line"><span class="dim">资源</span><code id="ask-resource"></code></div>
          <div class="ask-line"><span class="dim">记住为</span><code id="ask-remember"></code></div>
        </div>
        <div id="question-fields" class="hidden">
          <div id="ask-question"></div>
          <div id="ask-options"></div>
          <input id="ask-answer" type="text" placeholder="输入你的回答" />
        </div>
      </div>
      <div class="ask-buttons" id="permission-buttons">
        <button id="ask-deny">拒绝</button>
        <button id="ask-always" title="写入项目 .kanzei/kanzei.toml,之后不再询问">总是允许</button>
        <button id="ask-allow" class="primary">允许一次</button>
      </div>
      <div class="ask-buttons hidden" id="question-buttons">
        <button id="ask-cancel">取消</button>
        <button id="ask-submit" class="primary">提交回答</button>
      </div>
    </div>
  </div>

  <div id="viewer-overlay" class="hidden">
    <div id="viewer-dialog">
      <div class="viewer-head">
        <span id="viewer-title"></span>
        <span>
          <button id="viewer-external" class="icon-btn" title="在外部编辑器打开">↗</button>
          <button id="viewer-close" class="icon-btn" title="关闭">✕</button>
        </span>
      </div>
      <div id="viewer-body"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="main.js" defer></script>
</body>
</html>
