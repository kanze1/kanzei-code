<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>kanzei</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="activitybar">
      <div class="activity-item active" data-view="chat" title="对话">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div class="activity-item" data-view="settings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
    </aside>

    <aside id="sidebar">
      <div class="sidebar-section" id="projects-section">
        <div class="section-title">
          <span>项目</span>
          <button id="project-add" class="icon-btn" title="添加项目目录">＋</button>
        </div>
        <div id="project-list" class="project-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title"><span>需求 <em id="req-count"></em></span></div>
        <div id="req-list" class="doc-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title"><span>缺陷 <em id="defect-count"></em></span></div>
        <div id="defect-list" class="doc-list"></div>
      </div>
    </aside>

    <main id="main">
      <!-- 对话视图 -->
      <div id="view-chat" class="view active">
        <header id="topbar">
          <span id="project-label" class="crumb"></span>
          <span class="spacer"></span>
          <select id="model-select" title="模型(agent 默认或直选)"></select>
          <select id="profile-select" title="模式">
            <option value="dev">dev 开发</option>
            <option value="research">research 研究</option>
          </select>
        </header>
        <section id="messages">
          <div id="empty-state">
            <div class="logo-mark">K</div>
            <div class="hint">输入任务开始 · 权限请求会弹窗询问 · Ctrl+Enter 发送</div>
          </div>
        </section>
        <footer id="composer">
          <textarea id="prompt" rows="3" placeholder="想做什么?"></textarea>
          <div id="composer-bar">
            <span id="hint" class="dim"></span>
            <div class="composer-actions">
              <button id="stop" class="danger hidden">停止</button>
              <button id="send" class="primary">发送</button>
            </div>
          </div>
        </footer>
      </div>

      <!-- 设置视图 -->
      <div id="view-settings" class="view">
        <div id="settings-scroll">
          <h1>设置</h1>
          <p class="dim">写入全局 <code id="settings-path"></code>,项目级 .kanzei/kanzei.toml 会覆盖全局。</p>

          <h2>模型角色</h2>
          <div class="form-row">
            <label>primary <span class="dim">主循环</span></label>
            <input id="set-primary" placeholder="anthropic:claude-sonnet-5" spellcheck="false" />
          </div>
          <div class="form-row">
            <label>fast <span class="dim">子代理/杂活(本地模型)</span></label>
            <input id="set-fast" placeholder="ollama:qwen3" spellcheck="false" />
          </div>

          <h2>Provider</h2>
          <table id="providers-table">
            <thead><tr><th>名称</th><th>协议</th><th>Base URL</th><th>API Key 环境变量</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          <button id="provider-add" class="ghost">+ 添加 provider</button>

          <h2>网络与默认</h2>
          <div class="form-row">
            <label>代理</label>
            <select id="set-proxy-mode">
              <option value="env">跟随环境变量</option>
              <option value="off">直连</option>
              <option value="custom">指定地址</option>
            </select>
            <input id="set-proxy-url" placeholder="http://127.0.0.1:12000" spellcheck="false" class="hidden" />
          </div>
          <div class="form-row">
            <label>默认模式</label>
            <select id="set-profile">
              <option value="dev">dev 开发</option>
              <option value="research">research 研究</option>
            </select>
          </div>

          <div class="settings-actions">
            <button id="settings-open" class="ghost">打开配置原文</button>
            <button id="settings-save" class="primary">保存</button>
          </div>
        </div>
      </div>

      <div id="log-panel" class="hidden">
        <div class="log-head">
          <span>运行日志</span>
          <button id="log-clear" class="icon-btn" title="清空">⌫</button>
        </div>
        <div id="log-lines"></div>
      </div>

      <footer id="statusbar">
        <div class="status-left">
          <span id="status-dot" class="dot idle"></span>
          <span id="status-text">空闲</span>
          <span id="status-elapsed"></span>
        </div>
        <div class="status-right">
          <span id="status-tokens"></span>
          <span id="status-model"></span>
          <button id="log-toggle" class="statusbar-btn" title="显示/隐藏运行日志">日志</button>
          <span id="status-version"></span>
        </div>
      </footer>
    </main>
  </div>

  <div id="ask-overlay" class="hidden">
    <div id="ask-dialog">
      <div class="ask-title">权限请求</div>
      <div class="ask-body">
        <div class="ask-line"><span class="dim">操作</span><code id="ask-action"></code></div>
        <div class="ask-line"><span class="dim">资源</span><code id="ask-resource"></code></div>
      </div>
      <div class="ask-buttons">
        <button id="ask-deny">拒绝</button>
        <button id="ask-allow" class="primary">允许</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="main.js" defer></script>
</body>
</html>
