name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # v5 起跑在 Node 24 上;v4 目标 Node 20 已被 GitHub 弃用(Actions 面板黄条警告)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # R-209:前端检查依赖 eslint(ui-lint-smoke.mjs),先 npm ci 装齐依赖。
      - name: npm ci
        run: npm ci
      # The registry also selects the CI clippy variant with --all-targets.
      - name: Full verification
        shell: powershell
        run: .\scripts\verify.ps1 -Full -Ci

      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-runs
          path: dist/verification-runs
          if-no-files-found: ignore
