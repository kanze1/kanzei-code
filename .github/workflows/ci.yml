name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # v5 起跑在 Node 24 上;v4 目标 Node 20 已被 GitHub 弃用(Actions 面板黄条警告)
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # fmt 闸门由 R-156(全仓 fmt 收敛)交付时取消注释；当前仓库启用会失败。
      # - name: fmt
      #   run: cargo fmt --all -- --check
      # clippy 闸门由 R-146(warning 清零)交付时取消注释。
      # - name: clippy
      #   run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: ui smoke
        shell: bash
        run: |
          for f in crates/kanzei-app/ui/*.js; do node --check "$f"; done
          node scripts/ui-runtime-smoke.mjs
          node scripts/ui-a11y-smoke.mjs
          node scripts/ui-i18n-smoke.mjs
          node scripts/ui-markdown-smoke.mjs
